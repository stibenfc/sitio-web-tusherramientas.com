<svg width="1040" height="260" viewBox="0 0 1040 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33383F"/>
      <stop offset="100%" stop-color="#1D2126"/>
    </linearGradient>
    <linearGradient id="drillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A52"/>
      <stop offset="100%" stop-color="#FF6A13"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFDDBB"/>
      <stop offset="100%" stop-color="#FFB877"/>
    </linearGradient>
  </defs>

  <!-- fondo gris/antracita en badge redondeado -->
  <rect x="0" y="0" width="1040" height="260" rx="30" fill="url(#bgGrad)"/>

  <!-- ===================== ICONO TALADRO (vista lateral, horizontal) ===================== -->
  <g transform="translate(34,44)">
    <!-- sombra suave -->
    <ellipse cx="110" cy="192" rx="112" ry="9" fill="#000000" opacity="0.28"/>

    <!-- flecha de crecimiento: nace detras de la base y cruza por encima del cuerpo -->
    <path d="M8 158 Q95 118 150 60" stroke="url(#arrowGrad)" stroke-width="13" fill="none" stroke-linecap="round"/>
    <path d="M126 32 L182 20 L196 76" stroke="url(#arrowGrad)" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- cuerpo / carcasa del motor -->
    <rect x="20" y="56" width="150" height="50" rx="16" fill="url(#drillGrad)"/>
    <rect x="38" y="68" width="50" height="7" rx="3.5" fill="#1D2126" opacity="0.4"/>
    <rect x="38" y="82" width="32" height="7" rx="3.5" fill="#1D2126" opacity="0.28"/>

    <!-- mandril / nariz que se afina hacia la broca -->
    <path d="M170 60 L222 72 L222 86 L170 98 Z" fill="url(#drillGrad)"/>
    <rect x="222" y="76" width="18" height="6" rx="3" fill="#FFB877"/>

    <!-- empuñadura, baja en angulo desde el cuerpo -->
    <path d="M56 102 L112 102 L94 176 L30 176 Z" fill="url(#drillGrad)"/>

    <!-- base / bateria (tono oscuro para dar contraste y anclar el icono) -->
    <rect x="16" y="176" width="96" height="18" rx="8" fill="#14171B"/>
  </g>

  <!-- ===================== WORDMARK ===================== -->
  <g font-family="'Sora','Segoe UI',Arial,sans-serif">
    <text x="342" y="128" font-size="62" font-weight="500" fill="#D8DBE0">tus</text>
    <text x="452" y="128" font-size="62" font-weight="800" fill="#FFFFFF"
          textLength="520" lengthAdjust="spacingAndGlyphs">herramientas</text>
    <text x="342" y="184" font-size="42" font-weight="800" fill="#FF9A52">.com</text>
  </g>
</svg>
